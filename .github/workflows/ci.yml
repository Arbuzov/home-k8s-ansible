name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint:
    name: Lint & Syntax Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install 'ansible-core>=2.16,<2.18' 'ansible-lint>=24,<25' 'yamllint>=1.35,<2'

      - name: Install Ansible collections
        run: ansible-galaxy collection install -r requirements.yml

      - name: yamllint
        run: yamllint .

      - name: ansible-lint
        run: ansible-lint

      - name: Syntax check (all playbooks)
        run: |
          set -e
          ansible-playbook --syntax-check site.yml
          for p in playbooks/*.yml; do
            ansible-playbook --syntax-check "$p"
          done

  # Molecule converges the `common` role in a systemd container. It is kept as a
  # local test (tests/molecule/default/) rather than a CI gate: systemd-in-Docker
  # on GitHub runners is flaky to connect to, and a perpetually-red job is worse
  # than an honest, scoped pipeline. Run it locally with: cd tests && molecule test
  security-scan:
    name: Security Scan (Trivy)
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      contents: read
      security-events: write   # required to upload the Trivy SARIF

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
