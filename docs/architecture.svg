<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" width="780" height="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Cluster architecture: a kube-master control-plane node connected over Flannel VXLAN to three Raspberry Pi worker nodes.">
  <!-- connectors (drawn first, behind cards) -->
  <g stroke="#93a3b8" stroke-width="2" fill="none">
    <line x1="390" y1="144" x2="390" y2="206"/>
    <line x1="130" y1="206" x2="650" y2="206"/>
    <line x1="130" y1="206" x2="130" y2="250"/>
    <line x1="390" y1="206" x2="390" y2="250"/>
    <line x1="650" y1="206" x2="650" y2="250"/>
  </g>
  <g fill="#93a3b8">
    <circle cx="390" cy="144" r="3.5"/>
    <circle cx="130" cy="250" r="3.5"/>
    <circle cx="390" cy="250" r="3.5"/>
    <circle cx="650" cy="250" r="3.5"/>
  </g>

  <!-- control-plane node -->
  <rect x="230" y="24" width="320" height="120" rx="12" fill="#326ce5"/>
  <text x="390" y="58" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="700">kube-master</text>
  <text x="390" y="80" text-anchor="middle" fill="#dce8ff" font-size="11.5">Raspberry Pi 4  ·  control-plane + worker</text>
  <line x1="262" y1="92" x2="518" y2="92" stroke="#5b87e8" stroke-width="1"/>
  <text x="390" y="111" text-anchor="middle" fill="#eaf1ff" font-size="10.5">etcd · apiserver · controller-manager · scheduler</text>
  <text x="390" y="128" text-anchor="middle" fill="#eaf1ff" font-size="10.5">kubelet · kube-proxy · containerd</text>

  <!-- Flannel link label -->
  <rect x="278" y="161" width="224" height="30" rx="15" fill="#eef3fd" stroke="#326ce5" stroke-width="1.5"/>
  <text x="390" y="180" text-anchor="middle" fill="#1b3a8f" font-size="11" font-weight="600">Flannel · VXLAN · 10.244.0.0/16</text>

  <!-- worker nodes -->
  <g>
    <rect x="25" y="250" width="210" height="120" rx="12" fill="#ffffff" stroke="#326ce5" stroke-width="2"/>
    <text x="130" y="290" text-anchor="middle" fill="#16223a" font-size="15" font-weight="700">kube-worker-1</text>
    <text x="130" y="313" text-anchor="middle" fill="#566273" font-size="11.5">Raspberry Pi</text>
    <text x="130" y="343" text-anchor="middle" fill="#326ce5" font-size="11" font-weight="600">kubelet · kube-proxy</text>
  </g>
  <g>
    <rect x="285" y="250" width="210" height="120" rx="12" fill="#ffffff" stroke="#326ce5" stroke-width="2"/>
    <text x="390" y="290" text-anchor="middle" fill="#16223a" font-size="15" font-weight="700">kube-worker-2</text>
    <text x="390" y="313" text-anchor="middle" fill="#566273" font-size="11.5">Raspberry Pi</text>
    <text x="390" y="343" text-anchor="middle" fill="#326ce5" font-size="11" font-weight="600">kubelet · kube-proxy</text>
  </g>
  <g>
    <rect x="545" y="250" width="210" height="120" rx="12" fill="#ffffff" stroke="#326ce5" stroke-width="2"/>
    <text x="650" y="290" text-anchor="middle" fill="#16223a" font-size="15" font-weight="700">kube-worker-3</text>
    <text x="650" y="313" text-anchor="middle" fill="#566273" font-size="11.5">Raspberry Pi</text>
    <text x="650" y="343" text-anchor="middle" fill="#326ce5" font-size="11" font-weight="600">kubelet · kube-proxy</text>
  </g>
</svg>
