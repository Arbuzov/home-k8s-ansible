---
# Settings for master (control-plane) nodes
kubernetes_role: "master"

# API server
api_server_bind_port: 6443
api_server_cert_extra_sans:
  - "{{ ansible_default_ipv4.address }}"
  - "{{ ansible_hostname }}"
  - "localhost"
  - "127.0.0.1"

# etcd
etcd_data_dir: "/var/lib/etcd"

# Scheduler and controller-manager
scheduler_bind_address: "0.0.0.0"
controller_manager_bind_address: "0.0.0.0"

# Allow scheduling workloads on the master node
master_schedulable: true

# Taints for the master node (an empty list means pods may be scheduled)
master_taints: []
