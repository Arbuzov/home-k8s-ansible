---
# Settings for worker nodes
kubernetes_role: "worker"

# Kubelet
kubelet_max_pods: 110
kubelet_pod_cidr: "{{ kubernetes_pod_subnet | default('10.244.0.0/16') }}"

# Resource limits for Pi 3
resource_limits:
  cpu: "1000m"
  memory: "1Gi"

# ARM-specific tuning
arm_optimization: true
enable_legacy_iptables: true
