---
- name: Rollback Node to Previous Kubernetes Version
  hosts: "{{ target_host | default('all') }}"
  become: yes
  gather_facts: yes
  serial: 1

  pre_tasks:
    - name: Load credentials
      ansible.builtin.include_vars: ../credentials.json

    - name: Validate target_host is specified
      fail:
        msg: "Please specify target_host: ansible-playbook playbooks/rollback-node.yml -e target_host=kube-master"
      when: target_host is not defined

    - name: Validate rollback_version is specified
      fail:
        msg: "Please specify rollback_version: ansible-playbook playbooks/rollback-node.yml -e rollback_version=1.28"
      when: rollback_version is not defined

    # Non-interactive safety gate (works in CI / no TTY): require an explicit flag
    # rather than a blocking prompt. Run with -e confirm_rollback=true to proceed.
    - name: Require explicit confirmation for rollback
      fail:
        msg: >-
          Refusing to roll back {{ inventory_hostname }} to {{ rollback_version }}
          without confirmation. This may cause downtime/data loss.
          Re-run with -e confirm_rollback=true to proceed.
      when: not (confirm_rollback | default(false) | bool)

    - name: Refuse control-plane rollback (kubeadm cannot downgrade the control plane)
      ansible.builtin.fail:
        msg: >-
          Rolling back a control-plane node is not supported: `kubeadm upgrade apply`
          only moves forward. Restore the control plane from an etcd snapshot instead
          (see "Disaster recovery scope" in the README). This playbook is for workers.
      when: inventory_hostname in groups['masters']

  tasks:
    - name: Check current version
      command: kubelet --version
      register: current_version
      changed_when: false
      failed_when: false

    - name: Display rollback information
      debug:
        msg: |
          🔄 Rolling back: {{ inventory_hostname }}
          📦 Current: {{ current_version.stdout | default('Unknown') }}
          📦 Target: {{ rollback_version }}

    - name: Set rollback variables
      set_fact:
        kubernetes_target_version: "{{ rollback_version }}"
        drain_node: true
        update_system_packages: false
        apply_upgrade: true

    - name: Include rollback tasks
      include_tasks: ../roles/kubernetes/tasks/update-node.yml

  post_tasks:
    - name: Verify rollback success
      debug:
        msg: "✅ Rollback completed for {{ inventory_hostname }}"
