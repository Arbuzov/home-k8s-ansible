---
# Update several nodes to per-node target versions in one run.
# Define the plan in node-updates.yml (see node-updates.yml.example) and run:
#   ansible-playbook playbooks/update-multiple-nodes.yml -e @node-updates.yml -e @credentials.json
- name: Validate and show the update plan
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Validate node_updates is defined
      ansible.builtin.fail:
        msg: "Define node_updates (e.g. -e @node-updates.yml). See node-updates.yml.example."
      when: node_updates is not defined or node_updates | length == 0

    - name: Display update plan
      ansible.builtin.debug:
        msg: |
          Update plan:
          {% for node, config in node_updates.items() %}
          - {{ node }}: Kubernetes {{ config.version }}{% if config.drain | default(true) %} (drain){% endif %}{% if config.system_update | default(true) %} + system packages{% endif %}
          {% endfor %}

    - name: Confirm update execution
      ansible.builtin.pause:
        prompt: |
          Proceed with the update above? Nodes are updated one at a time.
          Press ENTER to continue or Ctrl+C to abort. (Set confirm_update=false to skip.)
      when: confirm_update | default(true)

# One play over the whole cluster, one node at a time. Hosts not in the plan
# end early. Per-node settings come from the node_updates dict.
- name: Execute node updates
  hosts: "{{ target_hosts | default('kubernetes_cluster') }}"
  become: true
  # gather_facts is deferred until after non-target hosts are skipped, so an
  # unreachable node that isn't in the plan can't abort the run (any_errors_fatal).
  gather_facts: false
  serial: 1
  any_errors_fatal: true  # stop the rolling upgrade on the first failed node
  vars:
    node_cfg: "{{ node_updates[inventory_hostname] | default({}) }}"
    kubernetes_target_version: "{{ node_cfg.version | default('') }}"
    drain_node: "{{ node_cfg.drain | default(true) }}"
    update_system_packages: "{{ node_cfg.system_update | default(true) }}"
    apply_upgrade: "{{ node_cfg.apply_upgrade | default(true) }}"

  pre_tasks:
    - name: Skip nodes not in the update plan
      ansible.builtin.meta: end_host
      when: inventory_hostname not in node_updates

    - name: Gather facts for target nodes only
      ansible.builtin.setup:

    - name: Display current node update info
      ansible.builtin.debug:
        msg: >-
          Updating {{ inventory_hostname }} -> {{ kubernetes_target_version }}
          (drain={{ drain_node }}, system_update={{ update_system_packages }})

  tasks:
    - name: Include single node update tasks
      ansible.builtin.include_tasks: ../roles/kubernetes/tasks/update-node.yml

  post_tasks:
    - name: Pause between nodes
      ansible.builtin.pause:
        seconds: "{{ wait_between_nodes | default(30) }}"
      when: (wait_between_nodes | default(30) | int) > 0

- name: Final cluster verification
  hosts: masters
  become: true
  gather_facts: false

  tasks:
    - name: Get final cluster status
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Node
      register: final_cluster_status
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf

    - name: Display final cluster status
      ansible.builtin.debug:
        msg: |
          Final cluster status:
          {% for node in final_cluster_status.resources %}
          - {{ node.metadata.name }}: {{ node.status.conditions | selectattr('type', 'equalto', 'Ready') | map(attribute='status') | first }} ({{ node.status.nodeInfo.kubeletVersion }})
          {% endfor %}

    - name: Fail if any node is not Ready after update
      ansible.builtin.assert:
        that:
          - (node.status.conditions | selectattr('type', 'equalto', 'Ready') | map(attribute='status') | first) == 'True'
        fail_msg: "Node {{ node.metadata.name }} is not Ready after update"
        success_msg: "Node {{ node.metadata.name }} is Ready"
      loop: "{{ final_cluster_status.resources }}"
      loop_control:
        loop_var: node
        label: "{{ node.metadata.name }}"
