---
- name: reboot system
  ansible.builtin.reboot:
    reboot_timeout: 300
    post_reboot_delay: 30
    test_command: uptime
  when: allow_reboot | default(true)  # set false in CI/containers

- name: restart systemd-resolved
  ansible.builtin.systemd:
    name: systemd-resolved
    state: restarted
    enabled: true
