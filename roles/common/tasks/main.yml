---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

# OS patching is bundled into the build for fresh nodes. Set run_system_upgrade=false
# to skip it when re-converging a live cluster (avoids surprise kernel/libc upgrades).
- name: Upgrade all packages
  ansible.builtin.apt:
    upgrade: dist
    autoremove: true
    autoclean: true
  when: run_system_upgrade | default(true)

- name: Set hostname from inventory
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}"
  notify: reboot system

- name: Update /etc/hosts with new hostname
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^127\.0\.1\.1'
    line: "127.0.1.1 {{ inventory_hostname }}"
    backup: true

- name: Install system packages
  ansible.builtin.apt:
    name: "{{ system_packages }}"
    state: present

- name: Set timezone
  community.general.timezone:
    name: "{{ timezone }}"

# Raspberry Pi OS moved the boot partition from /boot to /boot/firmware on
# bookworm+. Detect it once so config.txt and cmdline.txt edits land on the file
# that is actually read at boot.
- name: Detect Raspberry Pi boot directory
  ansible.builtin.stat:
    path: /boot/firmware/cmdline.txt
  register: boot_firmware_cmdline

- name: Set boot directory fact
  ansible.builtin.set_fact:
    rpi_boot_dir: "{{ '/boot/firmware' if boot_firmware_cmdline.stat.exists else '/boot' }}"

- name: Configure GPU memory split (Raspberry Pi)
  ansible.builtin.lineinfile:
    path: "{{ rpi_boot_dir }}/config.txt"
    regexp: '^gpu_mem='
    line: "gpu_mem={{ arm_memory_split }}"
    backup: true
  notify: reboot system
  when: ansible_machine in ['armv7l', 'aarch64']

- name: Enable cgroup memory and cpuset (Raspberry Pi cmdline)
  ansible.builtin.replace:
    path: "{{ rpi_boot_dir }}/cmdline.txt"
    regexp: '^(?!.*cgroup_enable=memory)(.+?)\s*$'
    replace: '\1 cgroup_enable=cpuset cgroup_enable=memory cgroup_memory=1'
  notify: reboot system
  when:
    - cgroup_enabled | default(true)
    - ansible_machine in ['armv7l', 'aarch64']

- name: Disable swap now
  ansible.builtin.command: swapoff -a
  when:
    - swap_disabled | default(true)
    - ansible_swaptotal_mb | default(0) > 0
  changed_when: ansible_swaptotal_mb | default(0) > 0

- name: Disable swap in fstab
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^([^#].*\sswap\s.*)$'
    replace: '#\1'
  when: swap_disabled | default(true)

- name: Disable dphys-swapfile service (if present)
  ansible.builtin.systemd:
    name: dphys-swapfile
    state: stopped
    enabled: false
  ignore_errors: true

- name: Ensure dphys-swapfile size is 0 (prevent recreation)
  ansible.builtin.lineinfile:
    path: /etc/dphys-swapfile
    regexp: '^CONF_SWAPSIZE='
    line: 'CONF_SWAPSIZE=0'
    create: true
    backup: true
  when: ansible_facts['os_family'] == 'Debian'
  ignore_errors: true

- name: Remove swap file if present
  ansible.builtin.file:
    path: /var/swap
    state: absent
  ignore_errors: true

- name: Load br_netfilter module
  community.general.modprobe:
    name: br_netfilter
    state: present

- name: Load overlay module
  community.general.modprobe:
    name: overlay
    state: present

- name: Ensure modules load on boot
  ansible.builtin.copy:
    dest: /etc/modules-load.d/k8s.conf
    mode: '0644'
    content: |
      br_netfilter
      overlay

- name: Configure sysctl for Kubernetes
  ansible.posix.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    sysctl_set: true
    sysctl_file: /etc/sysctl.d/99-kubernetes.conf
    state: present
    reload: true
  loop:
    - { name: 'net.bridge.bridge-nf-call-iptables', value: '1' }
    - { name: 'net.bridge.bridge-nf-call-ip6tables', value: '1' }
    - { name: 'net.ipv4.ip_forward', value: '1' }

- name: Configure DNS
  ansible.builtin.copy:
    dest: /etc/systemd/resolved.conf
    mode: '0644'
    content: |
      [Resolve]
      DNS={{ dns_servers | join(' ') }}
      FallbackDNS=8.8.8.8 1.1.1.1
      Cache=yes
      DNSStubListener=yes
  notify: restart systemd-resolved
  when: configure_dns | default(true)  # set false where systemd-resolved is absent (CI)
