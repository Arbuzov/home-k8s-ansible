---
- name: Check if cluster is already initialized
  stat:
    path: /etc/kubernetes/admin.conf
  register: cluster_initialized
  tags: [master-init, master-join]

- name: Initialize Kubernetes cluster
  command: >
    kubeadm init
    --kubernetes-version=v{{ kubernetes_version }}
    --image-repository={{ kubernetes_image_repository | default('registry.k8s.io') }}
    --pod-network-cidr={{ kubernetes_pod_subnet | default('10.244.0.0/16') }}
    --service-cidr={{ kubernetes_service_subnet | default('10.96.0.0/12') }}
    --apiserver-advertise-address={{ kubernetes_api_server_advertise_address | default(ansible_default_ipv4.address) }}
    --node-name={{ ansible_hostname }}
  register: kubeadm_init
  when: not cluster_initialized.stat.exists
  tags: [master-init]

- name: Create .kube directory for root
  file:
    path: /root/.kube
    state: directory
    mode: '0755'

- name: Copy admin.conf to root's kubeconfig
  copy:
    src: /etc/kubernetes/admin.conf
    dest: /root/.kube/config
    remote_src: yes
    owner: root
    group: root
    mode: '0644'

- name: Create .kube directory for pi user
  file:
    path: /home/pi/.kube
    state: directory
    owner: pi
    group: pi
    mode: '0755'

- name: Copy admin.conf to pi's kubeconfig
  copy:
    src: /etc/kubernetes/admin.conf
    dest: /home/pi/.kube/config
    remote_src: yes
    owner: pi
    group: pi
    mode: '0644'

# Idempotent: kubectl exits non-zero with "not found" when the taint is already
# gone, so a re-converge is a clean no-op instead of a hard failure.
- name: Allow scheduling on the control-plane node (remove taint)
  ansible.builtin.command: >
    kubectl taint nodes {{ ansible_hostname }}
    node-role.kubernetes.io/control-plane-
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: taint_result
  changed_when: "'untainted' in taint_result.stdout"
  # Tolerate only the "taint already absent" case; surface real errors such as
  # the Node object not existing yet.
  failed_when:
    - taint_result.rc != 0
    - not ('not found' in taint_result.stderr and 'taint' in taint_result.stderr)
  when: master_schedulable | default(true)

# kubectl apply (not kubernetes.core.k8s src:) because the manifest is a remote
# URL — the k8s module's src expects a local file path.
- name: Apply Flannel CNI manifest
  ansible.builtin.command: kubectl apply -f {{ flannel_manifest_url }}
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: flannel_apply
  changed_when: "'created' in flannel_apply.stdout or 'configured' in flannel_apply.stdout"
  when: kubernetes_cni == "flannel"

# Re-applying the upstream manifest above resets the DaemonSet args, so the
# iface preference is (re-)patched right after every apply.
- name: Configure Flannel interface preference
  ansible.builtin.include_tasks: flannel-iface.yml
  when:
    - kubernetes_cni == "flannel"
    - flannel_ifaces | default([]) | length > 0

- name: Generate join token
  command: kubeadm token create --print-join-command
  register: join_command
  changed_when: true  # always mints a fresh token
  tags: [master-join]

- name: Save join command to file
  copy:
    content: "{{ join_command.stdout }}"
    dest: /tmp/kubeadm-join-command
    mode: '0600'
  tags: [master-join]

- name: Fetch join command to local machine
  fetch:
    src: /tmp/kubeadm-join-command
    dest: ./kubeadm-join-command
    flat: yes
  tags: [master-join]

- name: Wait for cluster to be ready
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Node
    name: "{{ ansible_hostname }}"
    wait: true
    wait_condition:
      type: Ready
      status: "True"
    wait_timeout: 300
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf

# Mount external USB disk(s) on the control-plane node (opt-in via usb_mounts
# in host_vars). Independent of the k8s setup above.
- name: Mount USB disk(s) on the master
  ansible.builtin.include_tasks: usb-mount.yml
  when: usb_mounts | default([]) | length > 0
  tags: [usb-mount]
