---
# 3x-ui (by MHSanaei) — native systemd install, no Docker.
vpn_xui_version: "2.8.8"
vpn_xui_arch_map:
  aarch64: arm64
  x86_64: amd64
  armv7l: armv7
vpn_xui_arch: "{{ vpn_xui_arch_map[ansible_architecture] | default('amd64') }}"
vpn_xui_tarball: "x-ui-linux-{{ vpn_xui_arch }}.tar.gz"
vpn_xui_url: "https://github.com/MHSanaei/3x-ui/releases/download/v{{ vpn_xui_version }}/{{ vpn_xui_tarball }}"

# TLS — Let's Encrypt via certbot standalone (HTTP-01). Requires inbound :80 reachable and
# DNS for vpn_domain already pointing at this host (LE validates over HTTP to the domain).
# Renews headless via certbot.timer; the deploy hook copies fresh certs into the panel dir.
vpn_domain: ""               # e.g. vpn.example.com — set in inventory-vpn.yml (gitignored)
vpn_certbot_email: ""        # LE registration / expiry-notice email (empty => --register-unsafely-without-email)
vpn_cert_dir: /root/cert     # where the x-ui panel reads fullchain.pem / privkey.pem

# Panel DB = source of truth (inbounds, UUIDs, REALITY keys), kept out-of-band.
# Point this at a LOCAL backup to seed a FRESH box; it never overwrites an existing DB.
vpn_db_restore_src: ""
vpn_xui_db: /etc/x-ui/x-ui.db
