---
# Native 3x-ui (systemd) + Let's Encrypt. Mirrors the upstream manual install, idempotent.
# DB (/etc/x-ui/x-ui.db) holds all inbounds/keys and is the source of truth — never templated here.

- name: Install dependencies
  ansible.builtin.apt:
    name: [curl, tar, certbot, python3-certbot-dns-route53]
    state: present
    update_cache: true

- name: Read installed x-ui version stamp
  ansible.builtin.slurp:
    src: /usr/local/x-ui/.ansible_version
  register: vpn_xui_stamp
  failed_when: false

- name: Decide whether (re)install is needed
  ansible.builtin.set_fact:
    vpn_xui_need_install: "{{ (vpn_xui_stamp.content is not defined)
      or ((vpn_xui_stamp.content | b64decode | trim) != vpn_xui_version) }}"

- name: Install / upgrade x-ui binary
  when: vpn_xui_need_install
  block:
    - name: Download x-ui release tarball
      ansible.builtin.get_url:
        url: "{{ vpn_xui_url }}"
        dest: "/tmp/{{ vpn_xui_tarball }}"
        mode: '0644'

    - name: Extract x-ui into /usr/local
      ansible.builtin.unarchive:
        src: "/tmp/{{ vpn_xui_tarball }}"
        dest: /usr/local/
        remote_src: true
        extra_opts: ['--no-same-owner']

    - name: Make x-ui + xray executable
      ansible.builtin.file:
        path: "{{ item }}"
        mode: '0755'
      loop:
        - /usr/local/x-ui/x-ui
        - "/usr/local/x-ui/bin/xray-linux-{{ vpn_xui_arch }}"

    - name: Install x-ui management command
      ansible.builtin.get_url:
        url: "https://raw.githubusercontent.com/MHSanaei/3x-ui/v{{ vpn_xui_version }}/x-ui.sh"
        dest: /usr/bin/x-ui
        mode: '0755'

    - name: Stamp installed version
      ansible.builtin.copy:
        content: "{{ vpn_xui_version }}\n"
        dest: /usr/local/x-ui/.ansible_version
        mode: '0644'

# ponytail: own the unit instead of the tarball's `x-ui.service.debian` quirk — version-proof, ~12 lines.
- name: Install x-ui systemd unit
  ansible.builtin.copy:
    dest: /etc/systemd/system/x-ui.service
    mode: '0644'
    content: |
      [Unit]
      Description=x-ui Service
      After=network.target nss-lookup.target
      Wants=network.target

      [Service]
      Type=simple
      WorkingDirectory=/usr/local/x-ui/
      ExecStart=/usr/local/x-ui/x-ui
      Restart=on-failure
      RestartSec=5
      LimitNOFILE=infinity

      [Install]
      WantedBy=multi-user.target
  notify: restart x-ui

- name: Ensure x-ui state dir exists
  ansible.builtin.file:
    path: /etc/x-ui
    state: directory
    mode: '0755'

- name: Restore panel DB on a fresh box (never clobbers an existing DB)
  when: vpn_db_restore_src | length > 0
  block:
    - name: Check for existing panel DB
      ansible.builtin.stat:
        path: "{{ vpn_xui_db }}"
      register: vpn_db

    - name: Seed panel DB from backup
      ansible.builtin.copy:
        src: "{{ vpn_db_restore_src }}"
        dest: "{{ vpn_xui_db }}"
        mode: '0600'
      when: not vpn_db.stat.exists
      notify: restart x-ui

- name: Enable and start x-ui
  ansible.builtin.systemd:
    name: x-ui
    state: started
    enabled: true
    daemon_reload: true

- name: Configure TLS (Let's Encrypt)
  when: vpn_domain | length > 0
  block:
    - name: Ensure AWS credentials dir
      ansible.builtin.file:
        path: /root/.aws
        state: directory
        mode: '0700'

    - name: Write Route53 credentials for certbot
      ansible.builtin.copy:
        dest: /root/.aws/credentials
        mode: '0600'
        content: |
          [default]
          aws_access_key_id = {{ vpn_route53_access_key }}
          aws_secret_access_key = {{ vpn_route53_secret_key }}
      no_log: true

    - name: Check for existing certificate
      ansible.builtin.stat:
        path: "/etc/letsencrypt/live/{{ vpn_domain }}/fullchain.pem"
      register: vpn_le_cert

    - name: Obtain certificate (certbot DNS-01 via Route53)
      ansible.builtin.command: >
        certbot certonly --dns-route53 --non-interactive --agree-tos
        -m {{ vpn_certbot_email }} -d {{ vpn_domain }}
      when: not vpn_le_cert.stat.exists

    - name: Ensure panel cert dir exists
      ansible.builtin.file:
        path: "{{ vpn_cert_dir }}"
        state: directory
        mode: '0700'

    # The original outage: certbot renewed but never copied into the panel. Deploy hook fixes it for good.
    - name: Install certbot deploy hook (copy certs to panel + restart x-ui)
      ansible.builtin.copy:
        dest: /etc/letsencrypt/renewal-hooks/deploy/x-ui-cert.sh
        mode: '0755'
        content: |
          #!/bin/sh
          # Managed by Ansible (roles/vpn). Runs after every successful renewal.
          cp -f /etc/letsencrypt/live/{{ vpn_domain }}/fullchain.pem {{ vpn_cert_dir }}/
          cp -f /etc/letsencrypt/live/{{ vpn_domain }}/privkey.pem  {{ vpn_cert_dir }}/
          systemctl restart x-ui

    - name: Seed panel cert dir from current certificate
      ansible.builtin.copy:
        src: "/etc/letsencrypt/live/{{ vpn_domain }}/{{ item }}"
        dest: "{{ vpn_cert_dir }}/{{ item }}"
        remote_src: true
        mode: '0600'
      loop: [fullchain.pem, privkey.pem]
      notify: restart x-ui

# Root fs is small (~8G); a single x-ui log once filled it to 100%.
- name: Rotate x-ui logs
  ansible.builtin.copy:
    dest: /etc/logrotate.d/x-ui
    mode: '0644'
    content: |
      /var/log/x-ui/*.log {
        weekly
        rotate 3
        size 50M
        missingok
        notifempty
        copytruncate
      }
