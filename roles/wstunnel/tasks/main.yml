---
# Native wstunnel server (systemd), no Docker. Idempotent, minimal — the relay only
# shuffles bytes. Its config lives entirely in the systemd unit; nothing else is stateful.

- name: Require an upstream allowlist (refuse to configure an open relay)
  ansible.builtin.assert:
    that:
      - wstunnel_restrict_to | length > 0
      - "':' in wstunnel_restrict_to"
    fail_msg: >-
      wstunnel_restrict_to must be set as host:port (e.g. '<GCP_IP>:1194') — a public :80
      relay without a valid --restrict-to allowlist is an open proxy. Set it in inventory-vpn.yml.

- name: Ensure tar is present (needed to unpack the release)
  ansible.builtin.apt:
    name: tar
    state: present
    update_cache: true

- name: Create wstunnel system user
  ansible.builtin.user:
    name: "{{ wstunnel_user }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false

# Idempotency via the binary's own version string ("wstunnel-cli 10.5.1"), not a stamp
# file — one task, and it also re-installs if the binary was swapped out of band.
- name: Read installed wstunnel version
  ansible.builtin.command: "{{ wstunnel_bin }} --version"
  register: wstunnel_installed
  changed_when: false
  failed_when: false

# Match the version as a whole whitespace token ("wstunnel-cli 10.5.1"), not a substring —
# otherwise desired 10.5.1 would treat an installed 10.5.10 as already correct.
- name: Decide whether (re)install is needed
  ansible.builtin.set_fact:
    wstunnel_need_install: "{{ wstunnel_version not in (wstunnel_installed.stdout | default('')).split() }}"

- name: Install / upgrade wstunnel binary
  when: wstunnel_need_install
  block:
    - name: Download wstunnel release tarball
      ansible.builtin.get_url:
        url: "{{ wstunnel_url }}"
        dest: "/tmp/{{ wstunnel_tarball }}"
        mode: '0644'
        checksum: "{{ wstunnel_checksum_map[wstunnel_arch] | default(omit) }}"

    # Tarball is flat (LICENSE, README.md, wstunnel). Extract to /tmp then copy just the
    # binary — robust across ansible versions, and keeps LICENSE/README out of /usr/local/bin.
    - name: Extract wstunnel release
      ansible.builtin.unarchive:
        src: "/tmp/{{ wstunnel_tarball }}"
        dest: /tmp/
        remote_src: true
        extra_opts: ['--no-same-owner']

    - name: Install wstunnel binary
      ansible.builtin.copy:
        src: /tmp/wstunnel
        dest: "{{ wstunnel_bin }}"
        remote_src: true
        owner: root
        group: root
        mode: '0755'
      notify: Restart wstunnel

# ponytail: own the unit (upstream ships none) — bind :80 unprivileged via ambient caps.
- name: Install wstunnel systemd unit
  ansible.builtin.copy:
    dest: /etc/systemd/system/wstunnel.service
    mode: '0644'
    content: |
      [Unit]
      Description=wstunnel server (WebSocket relay for WireGuard)
      After=network.target nss-lookup.target
      Wants=network.target

      [Service]
      Type=simple
      User={{ wstunnel_user }}
      Group={{ wstunnel_user }}
      # Bind privileged :80 without running as root.
      AmbientCapabilities=CAP_NET_BIND_SERVICE
      CapabilityBoundingSet=CAP_NET_BIND_SERVICE
      NoNewPrivileges=true
      ExecStart={{ wstunnel_bin }} server {{ wstunnel_listen }} --websocket-ping-frequency {{ wstunnel_ping_frequency }} --restrict-to {{ wstunnel_restrict_to }}
      Restart=on-failure
      RestartSec=5
      LimitNOFILE=1048576
      # Hardening — all safe for a pure network relay (it writes nothing to disk).
      ProtectSystem=strict
      ProtectHome=true
      PrivateTmp=true
      ProtectKernelTunables=true
      ProtectKernelModules=true
      ProtectControlGroups=true
      RestrictRealtime=true

      [Install]
      WantedBy=multi-user.target
  notify: Restart wstunnel

- name: Enable and start wstunnel
  ansible.builtin.systemd:
    name: wstunnel
    state: started
    enabled: true
    daemon_reload: true
